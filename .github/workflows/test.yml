# CI gate: Render deploys main only after this passes (autoDeployTrigger:
# checksPass in render.yaml), so a red suite never reaches production.
#
# Installs from uv.lock (--locked fails the run if the lock is stale), so
# what CI tests is the pinned set the project resolved, not whatever the
# index serves that day.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"   # matches the Render runtime
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
