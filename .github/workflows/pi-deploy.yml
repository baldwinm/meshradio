# Moves the `pi-deploy` branch to each main commit the test workflow passed.
# The Pi's update timer (deploy/auto-update.sh) follows that branch, so it
# only ever installs a commit CI has gated — the same rule Render deploys by.
#
# Only forward: when runs finish out of order, an older commit never moves
# the branch back. Pushed with GITHUB_TOKEN, so the push itself starts no
# workflows.
name: pi-deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency: pi-deploy

jobs:
  advance:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Advance pi-deploy
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is not on main; leaving pi-deploy alone"
            exit 0
          fi
          if git rev-parse --quiet --verify origin/pi-deploy >/dev/null &&
             ! git merge-base --is-ancestor origin/pi-deploy "$SHA"; then
            echo "pi-deploy is already past $SHA"
            exit 0
          fi
          git push origin "$SHA:refs/heads/pi-deploy"
