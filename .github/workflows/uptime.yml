# Uptime check for the public site: every ten minutes, ask /healthz whether
# meshradio.co is up and still hearing from the mesh (ingest_age_s: seconds
# since a relay push or an analyzer poll last succeeded), whether the Pi is
# still pushing (relay_age_s: the site polls the analyzers itself, so a
# silent Pi never makes ingest stale), and whether anything has been
# failing (errors_1h: crashed loops, failed background tasks and requests
# that raised, which otherwise only reach the logs), and whether the Pi's
# auto-updater is keeping it current (pi_update.ok: false once a run is
# blocked, rolled back or failed, none has run for half an hour, or the Pi
# has been on a different commit from the site for half an hour; the Pi
# relays this with each push). A failure is checked
# once more three minutes later, so a deploy's restart doesn't count: the
# relay pushes every two minutes, and a fresh process has heard nothing yet.
#
# Still failing: open an issue labelled `uptime`, one per outage, assigned to
# UPTIME_ASSIGNEE (a repository variable, defaulting to the owner) so GitHub
# Mobile sends a push notification; it only pushes for things like
# assignments, not every new issue on a watched repository. Later failures
# re-add the assignee if someone took it off. Healthy again: comment and
# close it.
#
# GitHub turns scheduled workflows off after 60 days without a commit to the
# repository; the Actions tab has the button to turn this back on.
name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency: uptime

env:
  URL: https://meshradio.co/healthz
  # Analyzers are polled every three minutes; half an hour of nothing means
  # every feed (and the Pi relay) has stopped, not one slow poll.
  MAX_INGEST_AGE_S: 1800
  # The relay heartbeats every two minutes even with nothing new.
  MAX_RELAY_AGE_S: 1800
  # A one-off is in the logs; more than this in an hour is worth a look.
  MAX_ERRORS_1H: 2
  # Who each outage issue is assigned to (Settings → Secrets and variables →
  # Actions → Variables overrides it).
  ASSIGNEE: ${{ vars.UPTIME_ASSIGNEE || 'baldwinm' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /healthz
        id: health
        run: |
          check() {
            body="$(curl -fsS --max-time 20 "$URL")" || { echo "$URL didn't answer"; return 1; }
            echo "$body" | jq -e '.ok == true' >/dev/null || { echo "not ok: $body"; return 1; }
            age="$(echo "$body" | jq '.ingest_age_s')"
            if [ "$age" = "null" ] || [ "${age%.*}" -gt "$MAX_INGEST_AGE_S" ]; then
              echo "no ingest for ${age}s (limit ${MAX_INGEST_AGE_S}s): $body"
              return 1
            fi
            # "absent": a site still on a build from before these fields.
            relay="$(echo "$body" | jq 'if has("relay_age_s") then .relay_age_s else "absent" end')"
            if [ "$relay" = "null" ] || { [ "$relay" != '"absent"' ] && [ "${relay%.*}" -gt "$MAX_RELAY_AGE_S" ]; }; then
              echo "no push from the Pi relay for ${relay}s (limit ${MAX_RELAY_AGE_S}s): $body"
              return 1
            fi
            # null: no report yet (a Pi from before it relayed one, or no timer).
            if [ "$(echo "$body" | jq '.pi_update.ok')" = "false" ]; then
              echo "the Pi isn't keeping up with main: its auto-update failed, or it and the site have been on different commits for half an hour (Admin → Overview → Updates says which): $body"
              return 1
            fi
            errors="$(echo "$body" | jq '.errors_1h // 0')"
            if [ "$errors" -gt "$MAX_ERRORS_1H" ]; then
              echo "$errors errors in the last hour (limit ${MAX_ERRORS_1H}); see the Render logs: $body"
              return 1
            fi
            echo "up: $body"
          }
          if out="$(check)"; then echo "$out"; echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$out; checking again in three minutes"
          sleep 180
          if out="$(check)"; then echo "$out"; echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$out"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          { echo "detail<<EOF"; echo "$out"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Open or close the outage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OK: ${{ steps.health.outputs.ok }}
          DETAIL: ${{ steps.health.outputs.detail }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh issue list --label uptime --state open --json number --jq '.[0].number')"
          if [ "$OK" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Healthy again as of $(date -u '+%Y-%m-%d %H:%M UTC'). [Check run]($RUN)"
            fi
            exit 0
          fi
          if [ -z "$open" ]; then
            gh label create uptime --color B60205 --description "Opened by the uptime check" --force
            printf 'The uptime check failed twice, three minutes apart.\n\n```\n%s\n```\n\n[Check run](%s). This issue closes itself when the site is healthy again.\n' \
              "$DETAIL" "$RUN" > body.md
            open="$(gh issue create --label uptime --title "meshradio.co health check failing" --body-file body.md)"
            open="${open##*/}"
          fi
          # Separate from the create, so a bad assignee still leaves the issue
          # open; adding someone already assigned is a no-op.
          gh issue edit "$open" --add-assignee "$ASSIGNEE" \
            || echo "::warning::couldn't assign #$open to $ASSIGNEE"
          exit 0   # the issue is the alert; a red run every ten minutes would email too
