[project]
name = "meshradio"
version = "0.9.0"
description = "A standalone internet radio that plays the Austin MeshCore #music channel."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Media playback/download — installable everywhere, but mpv needs libmpv at
# runtime. yt-dlp[default] bundles the EJS challenge solver YouTube requires
# (a JS runtime — deno — must also be installed on the machine).
media = [
    "yt-dlp[default]>=2025.10.22",
    "python-mpv>=1.0.7",
]
# Raspberry Pi hardware — only meaningful on the appliance itself.
hw = [
    "luma.oled>=3.13",
    "gpiozero>=2.0",
    "meshcore>=1.0",
]

[project.scripts]
meshradio = "meshradio.cli:main"

[dependency-groups]
browser = [
    "playwright>=1.55",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshradio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Errors and pyflakes, bugbear's likely bugs, modern syntax for 3.11+, the
# simplifications that read better, and sorted imports.
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["meshradio"]

[tool.mypy]
python_version = "3.11"
packages = ["meshradio"]
# mpv, meshcore, luma, gpiozero: hardware-only, untyped, imported lazily.
ignore_missing_imports = true
