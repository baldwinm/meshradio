# Public-hosting config (Render, Fly, etc.): embed mode.
#
# The browser streams every song straight from YouTube via the IFrame
# player — this server never downloads or serves audio, only metadata
# (video ids, titles, themes, queue order). That keeps a public
# deployment clear of redistributing copyrighted media.
hardware_profile = "dev"
data_dir = "./data"

[corescope]
enabled = true
base_url = "https://scope.digitaino.com"
channel = "#music"
poll_interval_s = 180

# Backup analyzer feed, polled alongside the primary (dedupe no-ops the
# overlap) so a CoreScope outage doesn't stop ingestion here.
[comchan]
enabled = true
base_url = "https://analyzer.comchan.net"
channel = "#music"
poll_interval_s = 180

[player]
backend = "embed"

[web]
host = "0.0.0.0"
port = 8080   # Render overrides this via --port $PORT
# Where visitors reach it: canonical links, previews and the sitemap come
# from here rather than the request's Host header, and an https site gets
# a Strict-Transport-Security header. With a custom domain on the service,
# set MESHRADIO_PUBLIC_URL in the dashboard to it ("https://example.com");
# the env var wins over this line.
public_url = "https://meshradio.onrender.com"
# Nothing reaches the app except through Render's proxy, so its forwarding
# headers are believed: the visitor's address (what the rate limiter and the
# admin sign-in throttle key on) and that they arrived over https.
trusted_proxies = ["*"]
# But Render's proxy appends to an X-Forwarded-For the visitor sent rather
# than replacing it, so only the right-hand entries are Render's own. Its
# users report the visitor's address arrives second from the right; reading
# the leftmost (uvicorn's way with "*") let anyone name their own address
# and walk around the rate limits. Admin -> Overview -> "This connection"
# shows the chain as it arrives, to check this number against.
proxy_hops = 2
