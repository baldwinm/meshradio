{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="center">
  <form class="card" method="post" action="/admin/login">
    <h1>MeshRadio admin</h1>
    {% if error %}<div class="notice bad" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Password
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    {% if two_step %}
    <label for="code">Authenticator code
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required>
    </label>
    {% endif %}
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
