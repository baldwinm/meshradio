{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="center">
  <form class="card" method="post" action="/admin/login/code">
    <h1>MeshRadio admin</h1>
    {% if error %}<div class="notice bad" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="code">Code from your authenticator app
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
    <a class="small" href="/admin/login">Start again</a>
  </form>
</div>
{% endblock %}
